services:
  grafana-max-alerts:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: grafana-max-alerts

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    # Uncomment if you create config.yaml for routing:
    # volumes:
    #   - ./config.yaml:/app/config.yaml:ro